version: '1.0'
classification: synthetic developer fixtures; not an independent benchmark
recipe: Deep-copy the named base bundle then apply exact field mutations to instantiate
  valid/invalid records. Expected routes/statuses are developer reference decisions;
  validator checks specified rejection codes, not AI routing accuracy.
cases:
- id: AV-T01
  title: AD master present but delivered rendition fails
  synthetic: true
  base: examples/synthetic-programme-and-service-cycle.yaml
  mutations:
  - record_id: DELIV-PASS
    path: data.result
    value: fail
  expected_error_codes:
  - E_DELIVERY
  - E_RETEST
  expected_route: WF11
  expected_status: delivery fail; positive conclusion blocked
  prohibited_conclusions:
  - Master presence proves usable AD
  evidence_required:
  - actual delivered route retest
