    - report_version
    - report_digest
    - approval_id
    - operation
    - receipt
    - transaction_id
    - channel
    - idempotency_key
    additionalProperties: false
  complaint:
    type: object
    properties:
      programme_id: *id001
      route_id: *id001
      channel: *id001
      barrier: *id001
      accessible_contact_test_id: *id001
      issue_id: *id001
      response_due_basis: *id001
      evidence_ids:
        type: array
        items: *id001
        minItems: 1
    required:
    - programme_id
    - route_id
    - channel
    - barrier
    - accessible_contact_test_id
    - issue_id
    - response_due_basis
    - evidence_ids
    additionalProperties: false
  monitoring:
    type: object
    properties:
      trigger: *id001
      affected_ids:
        type: array
        items: *id001
        minItems: 1
      next_action: *id001
      review_due: *id001
      evidence_ids:
        type: array
        items: *id001
        minItems: 1
    required:
    - trigger
    - affected_ids
    - next_action
    - review_due
    - evidence_ids
    additionalProperties: false
  delegation:
    type: object
    properties:
      human_name: *id001
      authority_basis: *id001
      operations:
        type: array
        items: *id001
        minItems: 1
      resources:
        type: array
        items: *id001
        minItems: 1
      valid_from: *id001
      expires: *id001
      revoked: *id003
      limits: *id001
      escalation: *id001
    required:
    - human_name
    - authority_basis
    - operations
    - resources
    - valid_from
    - expires
    - revoked
    - limits
    - escalation
    additionalProperties: false
  approval:
    type: object
    properties:
      target_id: *id001
      target_version: *id001
      target_digest:
        type: string
        pattern: ^[a-f0-9]{64}$
      dependency_digests:
        type: object
        additionalProperties:
          type: string
          pattern: ^[a-f0-9]{64}$
      human_name: *id001
      delegation_id: *id001
      authority_basis: *id001
      approved_scope:
        type: object
        properties:
          service: *id001
          period: *id001
          region: *id001
        required:
        - service
        - period
        - region
        additionalProperties: false
      approval_date: *id001
      valid_until: *id001
    required:
    - target_id
    - target_version
    - target_digest
    - dependency_digests
    - human_name
    - delegation_id
    - authority_basis
    - approved_scope
    - approval_date
    - valid_until
    additionalProperties: false
  conclusion:
    type: object
    properties:
      requirement_id: *id001
      classification_id: *id001
      result:
        enum:
        - met
        - not_met
        - cannot_conclude
        - not_applicable
      rationale: *id001
      evidence_ids:
        type: array
        items: *id001
        minItems: 1
      coverage_ids: *id002
      quality_ids: *id002
      viewer_ids: *id002
      unresolved_issues: *id002
    required:
    - requirement_id
    - classification_id
    - result
    - rationale
    - evidence_ids
    - coverage_ids
    - quality_ids
    - viewer_ids
    - unresolved_issues
    additionalProperties: false
  claim:
    type: object
    properties:
      conclusion_id: *id001
      wording: *id001
      evidence_ids:
        type: array
        items: *id001
        minItems: 1
      publication_state:
        enum:
        - draft
        - handoff
        - published
        - withdrawn
      destination: *id001
      valid_until: *id001
      withdrawal_owner: *id001
      receipt: *id001
    required:
    - conclusion_id
    - wording
    - evidence_ids
    - publication_state
    - destination
    - valid_until
    - withdrawal_owner
    - receipt
    additionalProperties: false
result_adapters:
  ATLF-1.1:
    source_id: X01
    source_locator: ATLF-14 Result vocabulary
    normalised_version: AVMSD-records-1.0
    mapping:
      Pass: pass
      Fail: fail
      Cannot tell: cannot_tell
      Not applicable: not_applicable
      Not tested: not_tested
      Blocked: blocked
      Tool error: tool_error
    review_rule: Preserve raw result and context. Incomplete/needs review remains
      tool detail and requires competent classification; never pass by default. invalid_assumptions
      is a local extension, not an ATLF source value.
