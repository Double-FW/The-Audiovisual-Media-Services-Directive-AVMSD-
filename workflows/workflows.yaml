version: '1.0'
state_model:
  states:
  - pending
  - running
  - blocked
  - failed
  - awaiting_approval
  - complete
  transitions:
    pending:
    - running
    - blocked
    running:
    - blocked
    - failed
    - awaiting_approval
    - complete
    blocked:
    - running
    failed:
    - running
    awaiting_approval:
    - complete
    - blocked
    complete: []
  rules:
  - complete requires evidence, dependency completion and required approval
  - blocked to running requires resolved dependency evidence
  - failed retry requires recorded corrective evidence
  - completed execution is immutable; create a new run for changed inputs
workflows:
- id: WF01
  name: Source verification
  trigger: source change or intake
  prerequisites: &id001
  - source identities
  inputs: *id001
  depends_on: []
  entry_rule: Dependencies apply to the affected operation; discovery research and
    incident preparation may begin independently under recorded authority. Do not
    bypass a required final decision.
  responsible_function: source maintenance
  accountable_human: source owner
  permitted_automation:
  - retrieve
  - draft
  - compare
  - calculate
  - validate
  - maintain authorised records
  decisions:
  - Exact consequential decision requires current human authority; no automatic legal
    or editorial approval
  output_types:
  - source
  steps:
  - id: WF01-S1
    action: verify currency and read selected units
    depends_on: []
    responsible_function: source maintenance
    evidence_required:
    - versioned inputs and observation/decision record
    human_gate: within recorded delegation
    completion: required records exist, checks pass, unresolved limits retained
    blocked_path: record owner/reason/next evidence; continue independent steps only
  - id: WF01-S2
    action: resolve conflicts against primary authority
    depends_on:
    - WF01-S1
    responsible_function: source maintenance
    evidence_required:
    - versioned inputs and observation/decision record
    human_gate: within recorded delegation
    completion: required records exist, checks pass, unresolved limits retained
    blocked_path: record owner/reason/next evidence; continue independent steps only
  - id: WF01-S3
    action: record adoption limits and unresolved access
    depends_on:
    - WF01-S2
    responsible_function: source maintenance
    evidence_required:
    - versioned inputs and observation/decision record
    human_gate: named authorised human review before consequential decision
    completion: required records exist, checks pass, unresolved limits retained
    blocked_path: record owner/reason/next evidence; continue independent steps only
  completion_conditions:
  - step evidence and dependencies verified
  - outputs linked and validated
  - required approvals bound to exact versions
  failure_paths:
  - 'blocked: missing facts, evidence, authority or methods'
  - 'failed: detected barrier or invalid data; route correction WF11'
  retry_rules: Read current outcome first; preserve attempt ID and versions; no duplicate
    external write; resume only on resolved dependency.
  review_triggers:
  - source/version/rights/configuration change
  - contradictory evidence
  - approval or delegation expiry
  integration_boundary: Operator handoff; no orchestration, broadcast, research-provider
    or regulator API implemented.
